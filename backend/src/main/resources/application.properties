spring.application.name=NAWELL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nawall}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:NAWELL}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}
apify.api-token=${APIFY_API_TOKEN:}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

app.upload-dir=${UPLOAD_DIR:uploads}

server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Keep a small, idle-friendly JDBC pool on low-traffic Railway services.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
app.reminders.enabled=${REMINDERS_ENABLED:true}
